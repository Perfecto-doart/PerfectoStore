<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Perfecto · VRChat outfits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="images/favicon.png">
<style>
/* VOICE: a black shop window with holographic foil, like a chrome Y2K sticker
   IDEA: frosted display glass over glowing holo light and the season's hero outfit
   PICTURE: holo-filled logo, holo season title, colour glows blurred behind glass
   COLOUR and TYPE: black, white, frost + holo (violet, ice blue, orchid); Microgramma Extd D (fallback Michroma) + Archivo
   LAYOUT: avatars | wide season rails | coupon + WIP; phones stack avatars, coupon, rails, WIP */
@font-face{font-family:"Microgramma Extd D";src:local("Microgramma D Extended Bold"),local("MicrogrammaDExtendedBold"),local("Microgramma D Extended"),url("fonts/microgramma.woff2") format("woff2"),url("fonts/microgramma.otf") format("opentype"),url("fonts/microgramma.ttf") format("truetype");font-weight:400 900;font-display:swap}
:root{color-scheme:dark;
  --v:#8f6bff;--b:#41c9ff;--o:#ff7ad9;--holo:linear-gradient(115deg,var(--v) 0%,var(--b) 50%,var(--o) 100%);
  --black:#000;--white:#fff;--soft:rgba(255,255,255,.62);--faint:rgba(255,255,255,.38);
  --glass:rgba(255,255,255,.065);--glass-hi:rgba(255,255,255,.12);--edge:rgba(255,255,255,.16);
  --blur:saturate(140%) blur(26px);--wide:"Microgramma Extd D",Michroma,"Eurostile Extended",sans-serif}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:90px}
body{margin:0;background:var(--black);color:var(--white);font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.orbs{position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(38vw 38vw at 8% 12%,rgba(143,107,255,.42),transparent 70%),radial-gradient(34vw 34vw at 92% 28%,rgba(65,201,255,.30),transparent 70%),radial-gradient(40vw 40vw at 70% 100%,rgba(255,122,217,.26),transparent 70%)}
h1,h2,h3{margin:0;font-weight:400;line-height:1.1}
.wide{font-family:var(--wide);letter-spacing:.02em}

/* backdrop: the season's outfit, greyscale, behind the glass */
.backdrop{position:fixed;inset:-8%;z-index:-3;background:#000 center/cover no-repeat;filter:blur(48px) saturate(1.2) brightness(.42);transform:scale(1.08);opacity:0;transition:opacity 1.2s ease}
.backdrop.on{opacity:1}
.shade{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 90% at 50% 10%,rgba(0,0,0,0) 0%,rgba(0,0,0,.35) 65%,rgba(0,0,0,.85) 100%)}
.glass{background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

/* top bar */
.top{position:sticky;top:0;z-index:10;border-width:0 0 1px}
.top .in{max-width:1760px;margin:0 auto;padding:14px max(3vw,14px);display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;margin-inline-end:auto}
.brand .mark{flex:none;width:44px;height:44px;background:var(--holo);-webkit-mask:url(images/logo.png) center/contain no-repeat;mask:url(images/logo.png) center/contain no-repeat;filter:drop-shadow(0 0 14px rgba(143,107,255,.45))}
.brand .tx{display:flex;flex-direction:column}
.brand b{font:400 clamp(20px,2.2vw,28px)/1 var(--wide);letter-spacing:.04em}
.brand span{font-size:13px;color:var(--soft);margin-top:4px}
.search{flex:0 1 340px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(0,0,0,.35);font-size:16px}
.search::placeholder{color:var(--faint)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:999px;text-decoration:none;font:400 12px var(--wide);letter-spacing:.06em;border:1px solid var(--edge);background:var(--glass)}
.pill.solid{background:var(--holo);color:var(--black);border-color:transparent}

/* shop grid */
.shop{max-width:1760px;margin:0 auto;padding:24px max(3vw,14px) 56px;display:grid;grid-template-columns:232px minmax(0,1fr) 288px;gap:24px;align-items:start}
.side,.aside{position:sticky;top:96px;max-height:calc(100vh - 112px);overflow-y:auto;scrollbar-width:none}
.side::-webkit-scrollbar,.aside::-webkit-scrollbar{display:none}
.panel{border-radius:22px;padding:16px}
.panel+.panel{margin-top:16px}
.ph{font:400 13px var(--wide);letter-spacing:.05em;margin:2px 4px 12px;color:var(--white)}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:5px 10px 5px 5px;border:0;border-radius:14px;background:none;text-align:start;cursor:pointer}
.item:hover{background:var(--glass-hi)}
.item[aria-current=true]{background:var(--holo);color:var(--black)}
.item .nm{display:flex;flex-direction:column;line-height:1.2;font-weight:600;font-size:15px}
.item .nm small{font-weight:400;font-size:12px;color:var(--faint)}
.item[aria-current=true] .nm small{color:rgba(0,0,0,.55)}
.item .ct{margin-inline-start:auto;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.item[aria-current=true] .ct{color:rgba(0,0,0,.6)}
.ico{flex:none;width:38px;height:38px;border-radius:50%;position:relative;overflow:hidden;display:grid;place-items:center;background:#000;border:1px solid var(--edge);font:400 11px var(--wide);letter-spacing:.04em}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item[aria-current=true] .ico{border-color:#000}
.dot{flex:none;width:38px;display:grid;place-items:center}
.dot i{width:8px;height:8px;border-radius:50%;background:var(--holo);opacity:.9}
.item[aria-current=true] .dot i{background:#000;opacity:1}
.more{margin-top:6px;width:100%;min-height:44px;border-radius:12px;border:1px dashed var(--edge);background:none;color:var(--soft);cursor:pointer;font-size:14px}

/* seasons */
.season{margin-bottom:40px}
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
.shead h2{font-family:var(--wide);font-size:clamp(22px,2.4vw,32px);letter-spacing:.03em}
.season.lead .shead h2{font-size:clamp(34px,5vw,72px);letter-spacing:.01em;background:var(--holo);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(65,201,255,.25))}
.when{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--edge);color:var(--soft);white-space:nowrap}
.when.now{background:var(--holo);color:var(--black);border-color:transparent}
.arrows{margin-inline-start:auto;display:flex;gap:8px}
.arrows button{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);cursor:pointer;display:grid;place-items:center}
.arrows svg{width:16px;height:16px}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
.rail .card{flex:0 0 calc((100% - 48px)/4);min-width:200px;scroll-snap-align:start}
.morehead{font:400 clamp(20px,2vw,26px) var(--wide);letter-spacing:.03em;margin:8px 0 22px;padding-top:28px;border-top:1px solid var(--edge);color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.fhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:18px}
.fhead h2{font:400 clamp(28px,3.6vw,48px) var(--wide)}
.fhead p{margin:0;color:var(--soft)}
.back{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);cursor:pointer;font-weight:600}

/* product card */
.card{border-radius:20px;overflow:hidden;display:flex;flex-direction:column;background:rgba(255,255,255,.055);border:1px solid var(--edge)}
.thumb{position:relative;aspect-ratio:1/1;background:#0d0d0d}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .blank{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint)}
.thumb .blank svg{width:42%;height:42%}
.free{position:absolute;top:10px;left:10px;background:var(--holo);color:var(--black);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font:600 15px/1.3 Archivo,sans-serif}
.price{margin-top:auto;padding-top:4px;font:400 14px var(--wide);letter-spacing:.03em;white-space:nowrap}
.buy{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:6px}
.btn{min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;text-decoration:none;font:400 11px var(--wide);letter-spacing:.05em;border:1px solid var(--white)}
.btn.j{background:var(--holo);color:var(--black);border-color:transparent}
.btn.g{background:transparent;color:var(--white)}
.btn:hover{filter:brightness(1.12)}.btn.g:hover{background:rgba(255,255,255,.1)}
.card{transition:border-color .2s,box-shadow .2s}.card:hover{border-color:rgba(143,107,255,.6);box-shadow:0 0 0 1px rgba(65,201,255,.25),0 18px 50px -20px rgba(143,107,255,.55)}
.empty{padding:48px 20px;text-align:center;border-radius:20px;color:var(--soft)}

/* coupon */
.coupon .tt{font:600 16px Archivo,sans-serif;margin:0 4px}
.coupon p.tt{color:var(--white);margin-bottom:0}
.coupon{box-shadow:0 0 60px -24px rgba(255,122,217,.6)}
.coupon p{margin:4px 4px 12px;color:var(--soft);font-size:14px}
.code{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:14px;border:1px solid transparent;background:linear-gradient(rgba(10,8,20,.85),rgba(10,8,20,.85)) padding-box,var(--holo) border-box}
.code b{font:400 13px var(--wide);letter-spacing:.06em;overflow-wrap:anywhere;flex:1}
.copy{flex:none;min-height:40px;min-width:76px;padding:0 14px;border-radius:10px;border:0;background:var(--holo);color:var(--black);font:400 11px var(--wide);letter-spacing:.05em;cursor:pointer}
.ends{display:block;margin:8px 4px 0;font-size:12px;color:var(--faint)}
.coupon+.coupon{margin-top:16px}

/* wip */
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shot{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:1px solid var(--edge);background:rgba(255,255,255,.05);padding:0;cursor:zoom-in}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot.ph-tile{cursor:default;display:grid;place-items:center;color:var(--faint)}
.shot.ph-tile svg{width:34%;height:34%}
.wipnote{margin:-4px 4px 12px;font-size:13px;color:var(--faint)}
.lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.8);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);display:none;place-items:center;padding:20px;cursor:zoom-out}
.lb.on{display:grid}
.lb img{max-width:min(92vw,1000px);max-height:88vh;border-radius:16px;border:1px solid var(--edge)}

footer{border-top:1px solid var(--edge);color:var(--soft);font-size:14px}
footer .in{max-width:1760px;margin:0 auto;padding:20px max(3vw,14px);display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}
footer a{color:var(--white)}

/* tablet */
@media(max-width:1260px){.shop{grid-template-columns:212px minmax(0,1fr) 248px}.rail .card{flex-basis:calc((100% - 32px)/3)}}
/* phones and small tablets: one column, avatars and types become swipe rows */
@media(max-width:960px){
  .shop{display:flex;flex-direction:column;gap:18px;padding-top:16px}
  .side,.aside{position:static;max-height:none;overflow:visible}
  .aside{display:contents}
  .side{order:1;width:100%}.coupons{order:2;width:100%}#main{order:3;width:100%}.wip{order:4;width:100%}
  .side.panel{padding:12px}
  .side .list{flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:4px;scroll-snap-type:x proximity}
  .side .item{flex:none;width:auto;min-height:44px;border:1px solid var(--edge);border-radius:999px;padding:4px 14px 4px 4px;scroll-snap-align:start}
  .side .item .ct,.side .item .nm small,.side .more{display:none}
  .side .ph{margin-top:14px}.side .ph:first-child{margin-top:2px}
  .rail .card{flex-basis:46%;min-width:0}
  .links .pill:not(.store){display:none}
  .search{flex:1 1 100%;order:3}
  .shots{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:520px){.rail .card{flex-basis:64%}.side .dot{width:14px}.shots{grid-template-columns:repeat(2,minmax(0,1fr))}.btn{font-size:10px}.top .in{padding-block:10px}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(22,22,22,.92)}}
@media(prefers-reduced-motion:reduce){.backdrop{transition:none}.rail{scroll-behavior:auto}}
@media(prefers-reduced-motion:no-preference){.rail{scroll-behavior:smooth}}
</style>
</head>

<footer><div class="in">

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^(https:\/\/|wip\/|images\/)/.test(u || "") ? esc(u) : "";
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const isFree = p => /^free$/i.test(p.price || "") || /^free\b/i.test(p.name || "");
const colOf = p => COLS[p.collection] ? p.collection : "special";
const alias = {};
GROUPS.forEach(([main, others]) => [main, ...others].forEach(n => alias[n.toLowerCase()] = main));
const baseKey = a => { const b = String(a).trim().replace(/\s+\d[\d.]*$/, ""); return alias[b.toLowerCase()] || b; };
const basesOf = p => [...new Set((p.bases || []).map(baseKey))];
const note = b => (GROUPS.find(g => g[0] === b) || [])[2] || "";
const initials = b => b.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
const hanger = `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M32 18a5 5 0 1 1 5-5"/><path d="M32 18v4L6 40h52L32 22"/></svg>`;
let P = [], WIP = [], COUPONS = [], BASES = [], counts = {}, q = "", showAll = false;

const card = p => {
  const img = safeUrl(p.image), j = safeUrl(p.jinxxy), g = safeUrl(p.gumroad);
  return `<article class="card"><div class="thumb">${img ? `<img src="${img}" alt="${esc(p.name)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'blank',innerHTML:window.__hanger}))">` : `<div class="blank">${hanger}</div>`}
      ${isFree(p) ? `<span class="free">Free</span>` : ""}</div>
    <div class="body"><h3>${esc(p.name)}</h3><span class="price">${esc(p.price || "")}</span>
      <div class="buy">${j ? `<a class="btn j" href="${j}" target="_blank" rel="noopener" aria-label="Buy ${esc(p.name)} on Jinxxy">Jinxxy</a>` : ""}${g ? `<a class="btn g" href="${g}" target="_blank" rel="noopener" aria-label="Buy ${esc(p.name)} on Gumroad">Gumroad</a>` : ""}</div>
    </div></article>`;
};
window.__hanger = hanger;

/* season order: running now (ending soonest first), then upcoming (starting soonest first) */
const DAY = 864e5;
const seasonInfo = (s, now) => {
  const y = now.getFullYear(), md = v => v.split("-").map(Number);
  const [sm, sd] = md(s[2]), [em, ed] = md(s[3]);
  for (const yy of [y - 1, y]) {
    const st = new Date(yy, sm - 1, sd), en = new Date(yy + (em < sm ? 1 : 0), em - 1, ed, 23, 59);
    if (now >= st && now <= en) return { live: true, key: en - now };
  }
  let st = new Date(y, sm - 1, sd); if (st < now) st = new Date(y + 1, sm - 1, sd);
  return { live: false, key: st - now, days: Math.ceil((st - now) / DAY) };
};
const orderedSeasons = () => { const now = new Date(); return SEASONS.map(s => ({ s, ...seasonInfo(s, now) })).sort((a, b) => (b.live - a.live) || a.key - b.key); };

const arrowSvg = d => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d < 0 ? "M10 3 5 8l5 5" : "M6 3l5 5-5 5"}"/></svg>`;
const rail = (title, badge, items, id, lead) => `<section class="season${lead ? " lead" : ""}"><div class="shead"><h2>${esc(title)}</h2>${badge}
    <div class="arrows"><button data-r="${id}" data-d="-1" aria-label="Scroll ${esc(title)} back">${arrowSvg(-1)}</button><button data-r="${id}" data-d="1" aria-label="Scroll ${esc(title)} forward">${arrowSvg(1)}</button></div></div>
  <div class="rail" id="rail${id}" tabindex="0" aria-label="${esc(title)} outfits">${items.map(card).join("")}</div></section>`;

/* sidebar */
const avEl = document.getElementById("avatars"), moreBtn = document.getElementById("moreav");
const buildSide = () => {
  counts = {};
  P.forEach(p => basesOf(p).forEach(b => counts[b] = (counts[b] || 0) + 1));
  BASES = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
  const LIMIT = 10, list = showAll || matchMedia("(max-width:960px)").matches ? BASES : BASES.slice(0, LIMIT);
  avEl.innerHTML = list.map(b => `<button class="item" data-h="a-${slug(b)}"><span class="ico">${esc(initials(b))}<img src="images/avatars/${slug(b)}.${ICON_EXT}" alt="" onerror="this.remove()"></span>
      <span class="nm">${esc(b)}${note(b) ? `<small>${esc(note(b))}</small>` : ""}</span><span class="ct">${counts[b]}</span></button>`).join("");
  moreBtn.hidden = BASES.length <= LIMIT;
  moreBtn.textContent = showAll ? "Show fewer avatars" : `Show all ${BASES.length} avatars`;
  document.getElementById("types").innerHTML = [["free", "Free outfits", P.filter(isFree).length],
    ...Object.entries(COLS).map(([k, l]) => [k, l, P.filter(p => colOf(p) === k).length]).filter(x => x[2])]
    .map(([k, l, n]) => `<button class="item" data-h="c-${k}"><span class="dot"><i></i></span><span class="nm">${esc(l)}</span><span class="ct">${n}</span></button>`).join("");
  mark();
};
moreBtn.addEventListener("click", () => { showAll = !showAll; buildSide(); });
const mark = () => { const h = location.hash.slice(1); document.querySelectorAll(".side .item").forEach(b => b.setAttribute("aria-current", b.dataset.h === h)); };

/* backdrop = first in-season product that has a picture */
const setBackdrop = () => {
  const first = orderedSeasons()[0], pic = P.find(p => colOf(p) === first.s[0] && safeUrl(p.image)) || P.find(p => safeUrl(p.image));
  if (!pic) return;
  const el = document.getElementById("backdrop"), im = new Image();
  im.onload = () => { el.style.backgroundImage = `url("${pic.image.replace(/"/g, "%22")}")`; el.classList.add("on"); };
  im.src = pic.image;
};

const main = document.getElementById("main");
const render = () => {
  mark();
  const h = location.hash.slice(1);
  let list = null, title = "", sub = "";
  if (h.startsWith("a-")) { const b = BASES.find(x => "a-" + slug(x) === h); if (b) { list = P.filter(p => basesOf(p).includes(b)); title = b; sub = note(b) ? `Includes ${note(b)}` : ""; } }
  if (h.startsWith("c-")) { const k = h.slice(2); if (k === "free") { list = P.filter(isFree); title = "Free outfits"; } else if (COLS[k]) { list = P.filter(p => colOf(p) === k); title = COLS[k]; } }
  if (q) { const s = q.toLowerCase(); list = (list || P).filter(p => (p.name + " " + basesOf(p).join(" ") + " " + (p.bases || []).join(" ") + " " + COLS[colOf(p)]).toLowerCase().includes(s)); title = title ? `${title}: “${q}”` : `Results for “${q}”`; }
  if (list) {
    main.innerHTML = `<div class="fhead"><h2>${esc(title)}</h2><p>${list.length} item${list.length === 1 ? "" : "s"}${sub ? ". " + esc(sub) : ""}</p><button class="back" data-back>Back to all seasons</button></div>
      ${list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<div class="empty glass">No outfits match that yet. Try another avatar or clear the search.</div>`}`;
    return;
  }
  const seasonKeys = SEASONS.map(s => s[0]);
  const seasons = orderedSeasons().map(({ s, live, days }, i) => {
    const items = P.filter(p => colOf(p) === s[0]);
    if (!items.length) return "";
    const badge = live ? `<span class="when now">In season now</span>` : `<span class="when">Starts in ${days} day${days === 1 ? "" : "s"}</span>`;
    return rail(s[1], badge, items, i, i === 0);
  }).join("");
  const more = Object.keys(COLS).filter(k => !seasonKeys.includes(k))
    .map((k, n) => { const items = P.filter(p => colOf(p) === k); return items.length ? rail(COLS[k], "", items, 100 + n) : ""; }).join("");
  main.innerHTML = seasons + (more ? `<h2 class="morehead">More outfits</h2>${more}` : "");
};

document.querySelector(".side").addEventListener("click", e => {
  const b = e.target.closest(".item"); if (!b) return;
  if (location.hash.slice(1) === b.dataset.h) { history.replaceState(null, "", location.pathname); render(); }
  else location.hash = b.dataset.h;

});
main.addEventListener("click", e => {

  const a = e.target.closest("[data-r]"); if (!a) return;

      <p class="tt">${esc(c.title || "Discount")}</p>${c.details ? `<p>${esc(c.details)}</p>` : ""}
      <div class="code"><b id="code${i}">${esc(c.code)}</b><button class="copy" data-code="${esc(c.code)}">Copy</button></div>
      ${ends ? `<span class="ends">Ends ${esc(ends)}</span>` : ""}</section>`;
  }).join("");
};
document.getElementById("coupons").addEventListener("click", async e => {
  const b = e.target.closest(".copy"); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.code); b.textContent = "Copied"; }
  catch { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; }
  setTimeout(() => b.textContent = "Copy", 1800);
});

/* WIP */
const shotsEl = document.getElementById("shots"), lb = document.getElementById("lb");
const buildWip = () => {
  document.getElementById("wipnote").hidden = WIP.length > 0;
  shotsEl.innerHTML = WIP.length
    ? WIP.map((w, i) => `<button class="shot" data-i="${i}" aria-label="Open WIP image ${i + 1}"><img src="${safeUrl(w.src)}" alt="" loading="lazy"></button>`).join("")
    : Array(4).fill(`<div class="shot ph-tile" aria-hidden="true">${hanger}</div>`).join("");
};
shotsEl.addEventListener("click", e => {
  const b = e.target.closest(".shot[data-i]"); if (!b) return;
  lb.innerHTML = `<img src="${safeUrl(WIP[Number(b.dataset.i)].src)}" alt="Work in progress">`; lb.classList.add("on");
});
lb.addEventListener("click", () => lb.classList.remove("on"));
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("on"); });

const getJSON = async f => { try { const r = await fetch(f, { cache: "no-cache" }); return r.ok ? await r.json() : null; } catch { return null; } };
(async () => {
  const [prods, w, c] = await Promise.all([getJSON("data/products.json"), getJSON("data/wip.json"), getJSON("data/coupons.json")]);
  P = (Array.isArray(prods) && prods.length ? prods : FALLBACK).filter(p => p && p.name && !p.hide);
  WIP = Array.isArray(w) ? w.filter(x => x && safeUrl(x.src)) : [];
  COUPONS = Array.isArray(c) ? c : [];
  buildSide(); buildCoupons(); buildWip(); render(); setBackdrop();
  let wasMobile = matchMedia("(max-width:960px)").matches;
  addEventListener("resize", () => { const m = matchMedia("(max-width:960px)").matches; if (m !== wasMobile) { wasMobile = m; buildSide(); } });
})();
}
</script>
</body>
</html>
